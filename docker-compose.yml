# 로컬 개발 전용. 다른 프로젝트(2Pick 55432)와 겹치지 않는 포트를 쓴다.
services:
  postgres:
    image: postgres:16-alpine
    ports: ["55433:5432"]
    environment:
      POSTGRES_USER: offai
      POSTGRES_PASSWORD: offai_dev # 개발 전용 값, 운영 credential 아님
      POSTGRES_DB: offai
    volumes: [offai_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offai"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  offai_pgdata:
